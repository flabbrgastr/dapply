[project]
name = "dapply"
version = "0.1.0"
description = "Web scraping and data aggregation system for performer/model data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "PyYAML>=6.0",
    "lxml>=4.9.0",
    "pandas>=2.0.0",
    "Flask>=2.0.0",
    "rapidfuzz>=3.14.5",
    "jellyfish>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
